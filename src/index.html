<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Victory Tracker - Suivi des Victoires</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>🏆 Victory Tracker</h1>
      <p>Suivi des victoires et confrontations entre joueurs</p>
    </header>

    <!-- Main Content -->
    <main class="main">
      <!-- Section Ajouter Joueur -->
      <section class="section">
        <h2>➕ Ajouter un Joueur</h2>
        <div class="form-group">
          <input
            type="text"
            id="joueurNom"
            placeholder="Nom du joueur"
            class="input"
          >
          <button id="btnAjouterJoueur" class="btn btn-primary">Ajouter</button>
        </div>
        <div id="messageAjout" class="message"></div>
      </section>

      <!-- Section Liste Joueurs -->
      <section class="section">
        <h2>👥 Joueurs</h2>
        <div id="listeJoueurs" class="joueurs-list">
          <p class="loading">Chargement...</p>
        </div>
      </section>

      <!-- Section Enregistrer Victoire -->
      <section class="section">
        <h2>⚔️ Enregistrer une Victoire</h2>
        <div class="form-group">
          <select id="joueur1" class="input">
            <option value="">Sélectionner Joueur 1</option>
          </select>
          <select id="joueur2" class="input">
            <option value="">Sélectionner Joueur 2</option>
          </select>
          <select id="gagnant" class="input">
            <option value="">Sélectionner le Gagnant</option>
          </select>
          <button id="btnAjouterVictoire" class="btn btn-success">Enregistrer Victoire</button>
        </div>
        <div id="messageVictoire" class="message"></div>
      </section>

      <!-- Section Tableau Confrontations -->
      <section class="section">
        <h2>📊 Tableau des Confrontations</h2>
        <div id="tableauConfrontations" class="tableau">
          <p class="loading">Chargement...</p>
        </div>
      </section>

      <!-- Section Statistiques -->
      <section class="section">
        <h2>📈 Statistiques</h2>
        <div id="statistiques" class="stats-grid">
          <p class="loading">Chargement...</p>
        </div>
      </section>

      <!-- Historique Victoires -->
      <section class="section">
        <h2>📜 Historique des Victoires</h2>
        <div id="historiqueVictoires" class="historique">
          <p class="loading">Chargement...</p>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
