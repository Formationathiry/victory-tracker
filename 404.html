<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Victory Tracker</title>
    <script>
      // Redirect to index.html and preserve the URL path for SPA routing
      var segmentCount = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/victory-tracker/index.html?p=/' + l.pathname.slice(1).split('/').slice(segmentCount).join('/')
      );
    </script>
  </head>
  <body>
  </body>
</html>
