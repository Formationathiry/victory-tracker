<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Victory Tracker</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      #loginPage {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: white;
        border-radius: 12px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 400px;
        width: 100%;
      }

      #loginPage h1 {
        margin-bottom: 30px;
        color: #333;
        font-size: 28px;
      }

      #githubLoginBtn {
        background: #24292e;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: background 0.3s;
        width: 100%;
        justify-content: center;
      }

      #githubLoginBtn:hover {
        background: #1a1e22;
      }

      #appPage {
        display: none;
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 1000px;
        width: 100%;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        border-bottom: 2px solid #667eea;
        padding-bottom: 20px;
      }

      .user-info {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      #userAvatar {
        width: 50px;
        height: 50px;
        border-radius: 50%;
      }

      #userName {
        color: #333;
        font-size: 16px;
      }

      #logoutBtn {
        background: #ff6b6b;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.3s;
      }

      #logoutBtn:hover {
        background: #ee5a52;
      }

      .container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        margin-bottom: 30px;
      }

      .section {
        background: #f9f9f9;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #e0e0e0;
      }

      .section h2 {
        margin-bottom: 15px;
        color: #667eea;
        font-size: 18px;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        color: #333;
        font-weight: 500;
      }

      input, select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
      }

      input:focus, select:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 5px rgba(102, 126, 234, 0.1);
      }

      button {
        background: #667eea;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.3s;
        width: 100%;
      }

      button:hover {
        background: #5568d3;
      }

      .btn-small {
        padding: 5px 10px;
        font-size: 12px;
        width: auto;
        background: #ff6b6b;
      }

      .btn-small:hover {
        background: #ee5a52;
      }

      #message {
        padding: 10px;
        margin-top: 10px;
        border-radius: 6px;
        text-align: center;
        font-size: 14px;
        min-height: 20px;
      }

      .joueur-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        background: white;
        margin-bottom: 8px;
        border-radius: 6px;
        border-left: 4px solid #667eea;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
      }

      th, td {
        padding: 10px;
        text-align: center;
        border: 1px solid #e0e0e0;
      }

      th {
        background: #667eea;
        color: white;
        font-weight: 600;
      }

      tr:nth-child(even) {
        background: #f9f9f9;
      }

      .stats-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
        margin-top: 15px;
      }

      .stat-card {
        background: white;
        padding: 15px;
        border-radius: 8px;
        border-left: 4px solid #667eea;
        text-align: center;
      }

      .stat-card strong {
        color: #667eea;
        display: block;
        margin-bottom: 10px;
      }

      .historique-item {
        padding: 10px;
        background: white;
        margin-bottom: 8px;
        border-radius: 6px;
        border-left: 4px solid #667eea;
        font-size: 14px;
      }

      @media (max-width: 768px) {
        .container {
          grid-template-columns: 1fr;
        }

        #appPage {
          padding: 15px;
        }

        .header {
          flex-direction: column;
          gap: 15px;
        }

        table {
          font-size: 12px;
        }

        th, td {
          padding: 5px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Login Page -->
    <div id="loginPage" class="login-container">
      <h1>⚽ Victory Tracker</h1>
      <p style="margin-bottom: 20px; color: #666;">Suivi des victoires et confrontations</p>
      <button id="githubLoginBtn">
        🔐 Se connecter avec GitHub
      </button>
    </div>

    <!-- App Page -->
    <div id="appPage">
      <div class="header">
        <h1>⚽ Victory Tracker</h1>
        <div class="user-info">
          <img id="userAvatar" src="" alt="Avatar" style="display: none;">
          <span id="userName"></span>
          <button id="logoutBtn">Déconnexion</button>
        </div>
      </div>

      <div class="container">
        <!-- Add Player Section -->
        <div class="section">
          <h2>Ajouter un Joueur</h2>
          <div class="form-group">
            <input type="text" id="joueurNom" placeholder="Nom du joueur">
            <button id="btnAjouterJoueur">Ajouter</button>
            <div id="messageAjout" style="color: green; margin-top: 10px;"></div>
          </div>
        </div>

        <!-- Add Victory Section -->
        <div class="section">
          <h2>Enregistrer une Victoire</h2>
          <div class="form-group">
            <label>Joueur 1</label>
            <select id="joueur1"></select>
          </div>
          <div class="form-group">
            <label>Joueur 2</label>
            <select id="joueur2"></select>
          </div>
          <div class="form-group">
            <label>Gagnant</label>
            <select id="gagnant"></select>
            <button id="btnAjouterVictoire" style="margin-top: 10px;">Enregistrer</button>
            <div id="messageVictoire" style="color: green; margin-top: 10px;"></div>
          </div>
        </div>
      </div>

      <!-- Players List -->
      <div class="section">
        <h2>Liste des Joueurs</h2>
        <div id="listeJoueurs"></div>
      </div>

      <!-- Confrontations Table -->
      <div class="section">
        <h2>Tableau des Confrontations</h2>
        <div id="tableauConfrontations"></div>
      </div>

      <!-- Statistics -->
      <div class="section">
        <h2>Statistiques</h2>
        <div id="statistiques"></div>
      </div>

      <!-- History -->
      <div class="section">
        <h2>Historique des Victoires</h2>
        <div id="historiqueVictoires"></div>
      </div>
    </div>

    <script type="module" src="/victory-tracker/src/main.js"></script>
  </body>
</html>
